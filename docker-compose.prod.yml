services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${PORT:-8080}:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      DB_CONNECTION: mariadb
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-alvo_db}"
      DB_USERNAME: "${DB_USERNAME:-alvo_user}"
      DB_PASSWORD: "${DB_PASSWORD:-secret_password}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CLERK_SECRET_KEY: "${CLERK_SECRET_KEY}"
      CLERK_PUBLISHABLE_KEY: "${CLERK_PUBLISHABLE_KEY}"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alvo-network

  mariadb:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-secret_password}"
      MYSQL_DATABASE: "${DB_DATABASE:-alvo_db}"
      MYSQL_USER: "${DB_USERNAME:-alvo_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret_password}"
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - alvo-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - alvo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  alvo-network:
    driver: bridge

volumes:
  mariadb-data:
    driver: local
  redis-data:
    driver: local
